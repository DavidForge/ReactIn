function traitsFor(g){let b=get(BASES,g.base)||BASES[0],p=get(PATTERNS,g.pattern)||PATTERNS[0];return {b,p}}
function forecast(g,actionKey){const m=get(MISSIONS,g.mission),w=m.waves[g.wave],{b,p}=traitsFor(g),a=ACTIONS[actionKey],ability=traitValue(b,p,w.tag);let structural=0;
if(b.id==='micro'&&w.tag==='sec')structural=3;
if(b.id==='serverless'&&w.tag==='sec')structural=4;
if(b.id==='serverless'&&w.tag==='coste')structural=5;
if(b.id==='mono'&&w.tag==='esc'&&w.intensity>=4)structural=4;
if(p.id==='events'&&w.tag==='sec')structural+=2;
let pressure=10+w.intensity*4+(5-ability)*4+Math.floor(g.debt/15)+m.baseDanger*2+structural;
let match=a.tags.includes(w.tag)?11:0;let synergy=0;
if(p.id==='events'&&actionKey==='queue')synergy+=5;
if(p.id==='hex'&&actionKey==='tests')synergy+=4;
if(p.id==='plugins'&&actionKey==='pluginAPI')synergy+=5;
if(b.id==='micro'&&actionKey==='breaker')synergy+=3;
if(b.id==='serverless'&&actionKey==='autoscale')synergy+=3;
if(b.id==='modular'&&actionKey==='modularize')synergy+=3;
let blocked=a.block+match+synergy+(ability>=4?2:0);
let loss=Math.max(0,Math.round((pressure-blocked)*.86));
let op=b.ops+p.ops+(b.id==='serverless'?Math.ceil(w.intensity*1.7):0);
let spend=a.cost+op-m.opsIncome;
let health=clamp(g.hp-loss,0,100),budget=g.budget-spend,debt=clamp(g.debt+a.debt+(w.intensity>=4?2:0),0,100),rep=clamp(g.rep+a.rep-Math.floor(loss/5),0,100);
return{ability,pressure,blocked,loss,spend,op,health,budget,debt,rep,action:a,tag:w.tag};}
function money(v){return `${v<0?'−':''}${Math.abs(v)}`}

function hud(g,m){let stage=Math.min(g.wave+1,m.waves.length);return `<div class="hudTitle"><div><h2>${m.emoji} ${m.name}</h2><small>${get(BASES,g.base).name} + ${get(PATTERNS,g.pattern).name} · Meta: ❤️≥${SLA[m.id].hp}%, 🕸️≤${SLA[m.id].debt}%</small></div><div class="pill">OLA ${stage} / ${m.waves.length}</div></div><div class="hudBar">${metric('❤️ Integridad',g.hp,'%',g.hp,g.hp<40?'red':'')}${metric('💠 Créditos',money(g.budget),'',g.budget/m.budget*100,g.budget<25?'red':'amber')}${metric('🕸️ Deuda',g.debt,'%',g.debt,'red')}</div><div class="progress" role="img" aria-label="Progreso ${stage} de ${m.waves.length}">${m.waves.map((_,i)=>`<span class="${i<g.wave?'done':i===g.wave?'current':''}"></span>`).join('')}</div>`}

function play(){if(!game)return home();const g=game,m=get(MISSIONS,g.mission),w=m.waves[g.wave],{b,p}=traitsFor(g);let capacity=traitValue(b,p,w.tag);let actions=w.options.map(id=>{let a=ACTIONS[id],f=forecast(g,id);return `<button type="button" class="actionCard" data-action="choose" data-id="${id}"><span class="actionTitle">${a.icon} ${a.name}</span><span class="actionDesc">${a.desc}</span><span class="actionBottom"><span class="cost">💠 ${a.cost}</span><span class="${f.loss<=5?'save':'dangerFont'}">${f.loss<=5?'✓':'⚠'} −${f.loss} HP</span></span><span class="forecast"><span>Coste total <b>${f.spend} cr</b> · ${a.debt>0?'+':''}${a.debt} deuda</span><span class="soft">${f.budget < -25 ? '⚠ Riesgo de quiebra' : a.tags.includes(w.tag)?'✦ Adecuada':'○ Compromiso'}</span></span></button>`}).join('');return `<button class="back" data-action="exit">← Contratos <span class="soft">(partida guardada)</span></button><div class="gameLayout"><div class="leftCol">${hud(g,m)}${visual(g)}</div><div class="rightCol"><div class="crisis"><div class="crisisHead"><span class="incident">⚠ INCIDENTE ${String(g.wave+1).padStart(2,'0')}</span>${badge(m.difficulty)}</div><h2>${w.title}</h2><p>${w.desc}</p><div class="riskInfo"><span>Se pone a prueba:</span><strong>${CAT[w.tag]}</strong><span>· Capacidad de tu diseño: <strong>${capacity}/5</strong></span></div></div><div class="actionHeading"><h3>¿Qué orden das?</h3><small>Elige 1 de 3</small></div><div class="actionGrid">${actions}</div><p class="legend">La pérdida de integridad está prevista con el modelo de juego. El coste total suma la acción y la operación del sistema, descontando ingresos. Menos integridad y más deuda dificultan las siguientes crisis.</p></div></div>`}
function choose(id){if(!game||game.phase!=='play')return;let m=get(MISSIONS,game.mission),w=m.waves[game.wave];if(!w.options.includes(id))return;let f=forecast(game,id),a=ACTIONS[id];let before={hp:game.hp,budget:game.budget,debt:game.debt,rep:game.rep};Object.assign(game,{hp:f.health,budget:f.budget,debt:f.debt,rep:f.rep});let tagLabel=CAT[w.tag];let help=f.ability>=4?`Tu diseño responde bien a ${tagLabel.toLowerCase()} (${f.ability}/5).`:`Tu diseño tiene un punto débil en ${tagLabel.toLowerCase()} (${f.ability}/5).`;
let why=`${help} ${a.note}`;if(game.budget<0)why+=' Ojo: la operación ha dejado tu saldo en negativo.';game.recent={title:w.title,action:id,loss:f.loss,spend:f.spend,ability:f.ability,tag:w.tag,why,before};game.history.push({...game.recent,after:{hp:game.hp,budget:game.budget,debt:game.debt,rep:game.rep}});
const insight={id:Date.now()+'-'+game.mission+'-'+game.wave,mission:m.id,missionName:m.name,base:game.base,pattern:game.pattern,title:w.title,why:why,action:a.name,seenAt:new Date().toISOString()};
if(!study.insights.some(v=>v.mission===insight.mission&&v.base===insight.base&&v.pattern===insight.pattern&&v.title===insight.title&&v.action===insight.action))study.insights.unshift(insight);
study.insights=study.insights.slice(0,150);persistStudy();game.phase='resolve';save(GAME_KEY,game);sfx(f.loss>17?'bad':'good');if(navigator.vibrate)navigator.vibrate(f.loss>17?[25,35,25]:12);go('resolve')}
function resolve(){let g=game,m=get(MISSIONS,g.mission),r=g.recent,loser=g.hp<=0||g.budget<-25;let title=loser?'El sistema está al límite':r.loss<=4?'Contención perfecta':r.loss<=12?'Crisis contenida':'Sobreviviste... por ahora';return `<button class="back" data-action="exit">← Salir (guardado)</button>${hud(g,m)}${visual(g)}<section class="resultBox"><div class="resultStamp">${r.loss<=8?'✓ IMPACTO CONTROLADO':'⚠ DAÑOS REGISTRADOS'}</div><h2>${title}</h2><p>Orden ejecutada: <strong style="color:#f0fbff">${ACTIONS[r.action].name}</strong>. Has resuelto «${r.title}».</p><div class="resultDeltas"><span class="delta">❤️ −${r.loss}%</span><span class="delta">💠 −${r.spend} cr netos</span><span class="delta">🕸️ ${g.debt-r.before.debt>=0?'+':''}${g.debt-r.before.debt} deuda</span><span class="delta">⭐ ${g.rep-r.before.rep>=0?'+':''}${g.rep-r.before.rep} reputación</span></div><div class="resultLearn"><strong>🧠 QUÉ ACABAS DE APRENDER</strong><p>${r.why}</p><p class="resultSaved">✓ Guardado automáticamente en Mi cuaderno</p></div><button class="primary" data-action="next">${loser?'VER INFORME FINAL':g.wave===m.waves.length-1?'EVALUAR SISTEMA':'SIGUIENTE CRISIS →'}</button></section>`}
function victory(g,m){return g.hp>=SLA[m.id].hp&&g.budget>=0&&g.debt<=SLA[m.id].debt}
function score(g){const m=get(MISSIONS,g.mission);let points=Math.round(g.hp*3.5+Math.max(0,g.budget)*2.2+(100-g.debt)*1.3+g.rep*1.5);points+=victory(g,m)?120:0;return clamp(points,0,999)}
function next(){if(!game||game.phase!=='resolve')return;const m=get(MISSIONS,game.mission);if(game.hp<=0||game.budget<-25||game.wave>=m.waves.length-1){game.phase='finish';let pts=score(game),old=progress.best[game.mission]||0;if(victory(game,m)&&pts>old){progress.best[game.mission]=pts;progress.wins=(progress.wins||0)+1;save(SAVE_KEY,progress)}save(GAME_KEY,null);go('finish');sfx('good');return;}game.wave++;game.phase='play';save(GAME_KEY,game);go('play');sfx('good')}
function finish(){if(!game)return home();const m=get(MISSIONS,game.mission),{b,p}=traitsFor(game),pts=score(game),succeeded=victory(game,m),rank=pts>=905?'S':pts>=780?'A':pts>=630?'B':pts>=490?'C':'D';const focus=m.focus.map(k=>({k,label:CAT[k],value:traitValue(b,p,k)}));let best=focus.slice().sort((a,b)=>b.value-a.value)[0],worst=Object.keys(CAT).filter(k=>k!==best.k).map(k=>({k,label:CAT[k],value:traitValue(b,p,k)})).sort((a,b)=>a.value-b.value)[0];let tips=`${b.name}: ${b.pro[0].toLowerCase()}; cuidado, ${b.con[0].toLowerCase()}.`;
return `<button class="back" data-action="tab" data-target="home">← Contratos</button><div class="finishHero"><div class="finishMedal">${succeeded?rank==='S'?'🏆':'🏅':'💥'}</div><div class="eyebrow">REPORTE FINAL · ${m.difficulty}</div><h1>${succeeded?'¡Sistema en pie!':'Arquitectura bajo presión'}</h1><div class="finalScore">${pts} <small>puntos · Rango ${rank}</small></div><p>${succeeded?'Salvaste el proyecto, pero cada decisión dejó su huella.':'No has cumplido el contrato. No basta con sobrevivir: hay que respetar la integridad mínima, el presupuesto y el límite de deuda.'}</p><div class="resultDeltas" style="justify-content:center"><span class="delta">🎯 Objetivo: ❤️ ≥${SLA[m.id].hp}%, 🕸️ ≤${SLA[m.id].debt}%</span><span class="delta">❤️ ${game.hp}%</span><span class="delta">💠 ${money(game.budget)} cr</span><span class="delta">🕸️ ${game.debt}% deuda</span><span class="delta">⭐ ${game.rep} reputación</span></div></div><div class="sectionTitle"><h2>¿Qué dice tu diseño?</h2><p>${b.name} + ${p.name}</p></div><div class="finishTraits"><div class="tile"><strong>💪 Fortaleza relevante</strong><p>${best.label}: ${best.value}/5. ${b.pro[0]}.</p></div><div class="tile"><strong>⚠ Punto débil del diseño</strong><p>${worst.label}: ${worst.value}/5. ${b.con[0]}.</p></div><div class="tile"><strong>🧩 Compromiso real</strong><p>${tips}</p></div><div class="tile"><strong>🔀 Qué probar después</strong><p>${b.id==='micro'?'Prueba el monolito modular y compara costes.':b.id==='serverless'?'Prueba microservicios y compara control operativo.':b.id==='mono'?'Prueba el monolito modular y compara evolución.':p.id==='events'?'Prueba Hexagonal o microservicios y compara aislamiento.':'Prueba eventos o microservicios para ver el precio de distribuir.'}</p></div></div><div class="finishBtns"><button class="primary" data-action="retry">↺ VOLVER A INTENTARLO</button><button class="secondary" data-action="rebuild">🔧 CAMBIAR ARQUITECTURA</button><button class="secondary" data-action="tab" data-target function encyclopediaCard(x){const e=studyEntry(x.id),rating=Number(e.rating)||0,cat=x.category||(BASES.includes(x)?'Distribución y despliegue':'Organización y comunicación'),txt=[x.name,cat,x.desc,...x.pro,...x.con,x.best].join(' ').toLowerCase();return `<article class="codexCard" id="concept-${x.id}" data-concept-card data-search="${escapeHTML(txt)}"><div class="codexHeader"><span style="font-size:27px">${x.emoji}</span>${badge(x.difficulty)}</div><h3>${x.name}</h3><p>${x.desc}</p><div class="proscons"><div><strong class="pro">✓ VENTAJAS</strong><ul>${x.pro.map(a=>`<li>${a}</li>`).join('')}</ul></div><div><strong class="con">✕ INCONVENIENTES</strong><ul>${x.con.map(a=>`<li>${a}</li>`).join('')}</ul></div></div><div class="tip"><b>Útil en:</b> ${x.best}</div><div class="personal"><div class="personalTitle"><span>⭐ TU VALORACIÓN · ${rating?rating+'/5':'Sin valorar'}</span><button type="button" class="learnBtn ${e.learned?'done':''}" data-action="learn" data-id="${x.id}" aria-pressed="${!!e.learned}">${e.learned?'✓ Lo tengo claro':'○ Marcar aprendido'}</button></div><div class="stars" role="group" aria-label="Valorar ${x.name}">${[1,2,3,4,5].map(n=>`<button type="button" class="${rating>=n?'on':''}" data-action="rate" data-id="${x.id}" data-value="${n}" aria-label="${n} de 5" aria-pressed="${rating===n}">★</button>`).join('')}</div><label class="studyHint" for="note-${x.id}">Mis apuntes (se guardan al escribir)</label><textarea id="note-${x.id}" data-note="${x.id}" maxlength="3000" placeholder="¿Qué entendiste? ¿Qué dudas tienes? ¿Cuándo lo usarías?">${escapeHTML(e.note||'')}</textarea></div></article>`}
function codex(){const groups=[{title:'01 / Despliegue principal · Elegibles en combate',arr:BASES},{title:'02 / Organización y comunicación · Tácticas en combate',arr:PATTERNS}];const cats=[...new Set(EXTRA.map(x=>x.category||'Otros'))];for(let i=0;i<cats.length;i++)groups.push({title:String(i+3).padStart(2,'0')+' / '+cats[i],arr:EXTRA.filter(x=>(x.category||'Otros')===cats[i])});const studied=Object.values(study.entries).filter(x=>x.learned).length;return `<section class="codexHero"><p class="eyebrow">MANUAL DE CAMPO</p><h1>${ALL_CONCEPTS.length} arquitecturas y patrones</h1><p>No hay una lista única ni categorías excluyentes. Aquí separamos distribución, organización, UI, eventos y datos. <strong>Muchos enfoques se combinan.</strong> Tus apuntes y valoraciones se guardan solo en este navegador.</p></section><div class="studyStats"><div class="studyStat"><strong>${ALL_CONCEPTS.length}</strong><span>Conceptos documentados</span></div><div class="studyStat"><strong>${studied}</strong><span>Marcados como aprendidos</span></div><div class="studyStat"><strong>${Object.keys(study.entries).filter(id=>study.entries[id].note?.trim()).length}</strong><span>Con apuntes propios</span></div></div><div class="studyToolbar"><input id="codexSearch" type="search" placeholder="Buscar monolito, hexagonal, CQRS..." aria-label="Buscar arquitecturas y patrones" autocomplete="off"><span class="pill" id="searchCount">${ALL_CONCEPTS.length} resultados</span></div>${groups.map(g=>`<section data-concept-group><h2 class="catalogTitle">${g.title}</h2><div class="codexGrid">${g.arr.map(encyclopediaCard).join('')}</div></section>`).join('')}<p class="footnote">La dificultad indica el esfuerzo aproximado de entender, aplicar y operar el enfoque en un contexto típico, no su calidad. Por ejemplo, DDD es un enfoque de modelado, CQRS un patrón y MVC una organización de presentación; no compiten directamente contra microservicios.</p>`}

function roadmapCard(area){const r=roadmapEntry(area.id),featured=area.tier==='next';return `<article class="futureCard ${featured?'featured':'planned'}" id="area-${area.id}" style="--area:${area.color}"><div class="futureCardHeader"><div class="futureIcon" aria-hidden="true">${area.emoji}</div><span class="soonBadge ${featured?'next':''}">${featured?'◈ EN LA LISTA PRÓXIMA':'◇ PLANIFICADO'}</span></div><h3>${escapeHTML(area.name)}</h3><p class="futureDescription">${escapeHTML(area.desc)}</p><div class="futureMeta"><span>🎯 ${escapeHTML(area.category)}</span><span class="tiny">Dificultad: ${escapeHTML(area.difficulty)}</span></div><div class="futureTopics">${area.topics.map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div>${area.comparisons?`<div class="futureMethods"><strong>🧠 CUÁNDO ELEGIR CADA ENFOQUE</strong>${area.comparisons.map(pair=>`<p><b>${escapeHTML(pair[0])}</b> · ${escapeHTML(pair[1])}</p>`).join('')}</div>`:''}<div class="futureExample"><b>⚔ EJEMPLO DE MISIÓN</b><p>${escapeHTML(area.scenario)}</p><small>🎮 ${escapeHTML(area.game)}</small></div>${area.references?`<div class="futureReferences">Fuentes: ${area.references.map(ref=>`<a href="${escapeHTML(ref[1])}" target="_blank" rel="noopener noreferrer">${escapeHTML(ref[0])} ↗</a>`).join(' · ')}</div>`:''}<div class="futureActions"><button type="button" class="interestButton ${r.interested?'active':''}" data-action="roadmap-interest" data-id="${area.id}" aria-pressed="${!!r.interested}">${r.interested?'✓ En mis prioridades':'☆ Me interesa'}</button><small>Vista previa · No jugable todavía</small></div><label class="futureNotes" for="roadmap-note-${area.id}">💬 Tu idea / qué quieres aprender</label><textarea id="roadmap-note-${area.id}" class="futureNoteArea" data-roadmap-note="${area.id}" maxlength="2000" placeholder="Ej.: Quiero un reto sobre colas y reintentos…">${escapeHTML(r.note||'')}</textarea></article>`}
function roadmap(){const filtered=FUTURE_AREAS.filter(a=>roadmapFilter==='saved'?roadmapEntry(a.id).interested:roadmapFilter==='next'?a.tier==='next':true);const next=filtered.filter(a=>a.tier==='next'),later=filtered.filter(a=>a.tier==='later');return `<section class="roadmapHero"><p class="eyebrow">Mapa de expansión · Vista anticipada</p><h1>Un juego para aprender <em>toda la ingeniería de software.</em></h1><p>Hoy juegas con arquitecturas. Después llegarán patrones, estilos guiados por eventos o datos, APIs, desarrollo con IA y más. Cada mundo tendrá <strong>mecánicas propias</strong>, no solo preguntas de memoria. Por ahora puedes explorar el plan, votar tus favoritos y dejar ideas.</p><div class="roadmapStats"><span>✅ Arquitecturas · Jugable</span><span>🔒 ${FUTURE_AREAS.length} mundos futuros</span><span>★ ${roadmapTotal()} en tu lista</span></div></section><div class="worldLine" aria-label="Progresión de áreas"><span class="worldNode live">01 · Arquitecturas ✓</span><span class="worldArrow">➜</span><span class="worldNode inactive">02 · Patrones</span><span class="worldArrow">➜</span><span class="worldNode inactive">03 · Estilos Driven</span><span class="worldArrow">➜</span><span class="worldNode inactive">04 · APIs</span><span class="worldArrow">➜</span><span class="worldNode inactive">05 · IA</span><span class="worldArrow">➜</span><span class="worldNode inactive">+ 9 mundos</span></div><p class="roadmapIntro"><strong>Ojo con las categorías:</strong> Event-Driven puede ser un estilo arquitectónico, Plugin-Driven suele referirse a extensibilidad y Data-Driven puede describir enfoques distintos según el contexto. En este futuro módulo los compararemos sin presentarlos como rivales directos de REST, MVC o microservicios.</p><div class="roadmapFilters"><button type="button" data-action="roadmap-filter" data-id="all" class="${roadmapFilter==='all'?'active':''}" aria-pressed="${roadmapFilter==='all'}">Todos (${FUTURE_AREAS.length})</button><button type="button" data-action="roadmap-filter" data-id="next" class="${roadmapFilter==='next'?'active':''}" aria-pressed="${roadmapFilter==='next'}">⭐ Próximos 4</button><button type="button" data-action="roadmap-filter" data-id="saved" class="${roadmapFilter==='saved'?'active':''}" aria-pressed="${roadmapFilter==='saved'}">★ Mi lista (${roadmapTotal()})</button></div>${next.length?`<section class="futureGroup"><h2>01 / Primeros mundos por construir</h2><p>Prioridad propuesta: patrones de diseño, estilos Driven, APIs y desarrollo con IA.</p><div class="futureGrid">${next.map(roadmapCard).join('')}</div></section>`:''}${later.length?`<section class="futureGroup"><h2>02 / Más áreas para el futuro</h2><p>Nueve mundos previstos para cuando ampliemos el juego.</p><div class="futureGrid">${later.map(roadmapCard).join('')}</div></section>`:''}${filtered.length?'':`<div class="roadmapEmpty">Todavía no has marcado áreas. Selecciona «Todos» y pulsa «☆ Me interesa» en tus favoritas.</div>`}<div class="roadmapCallout"><p>💾 <strong>Tu lista y comentarios se guardan en este navegador</strong> y se incluyen al exportar «Mi cuaderno» como JSON. Estas tarjetas son un plan, no funcionalidades que ya estén disponibles.</p><button class="secondary" type="button" data-action="tab" data-target="journal">📝 Abrir mi cuaderno</button></div>`}

function journal(){const touched=ALL_CONCEPTS.filter(x=>{let e=studyEntry(x.id);return e.learned||e.rating||(e.note||'').trim()}).sort((a,b)=>((studyEntry(b.id).updatedAt||'').localeCompare(studyEntry(a.id).updatedAt||'')));const learned=touched.filter(x=>studyEntry(x.id).learned).length,noted=touched.filter(x=>studyEntry(x.id).note?.trim()).length;return `<section class="codexHero"><p class="eyebrow">TU LABORATORIO PERSONAL</p><h1>Mi cuaderno de arquitectura</h1><p>Guarda qué has entendido, pon notas de 1 a 5 y escribe tus reflexiones. También archivamos las lecciones de las crisis que resuelves. Podrás revisarlas y editarlas aquí.</p></section><div class="studyStats"><div class="studyStat"><strong>${learned}</strong><span>Aprendidos</span></div><div class="studyStat"><strong>${noted}</strong><span>Con comentarios</span></div><div class="studyStat"><strong>${study.insights.length}</strong><span>Lecciones de juego</span></div></div><div class="backupActions"><button class="secondary" type="button" data-action="export-study">⬇ Exportar cuaderno JSON</button><button class="secondary" type="button" data-action="import-study">⬆ Importar copia JSON</button><input hidden id="studyImport" type="file" accept=".json,application/json"></div><p class="studyHint">Datos locales: no hay cuenta, sincronización ni servidor. Haz una copia si vas a cambiar de móvil, navegador o dominio.</p><div class="sectionTitle"><h2>Mis valoraciones y apuntes</h2><p>${touched.length} conceptos</p></div>${touched.length?`<div class="journalGrid">${touched.map(x=>{const e=studyEntry(x.id);return `<article class="journalCard"><h3>${x.emoji} ${x.name}</h3><p>${x.desc}</p><div class="journalMeta">${badge(x.difficulty)}<span class="pill">${e.rating?'★ '+e.rating+'/5':'Sin valorar'}</span>${e.learned?'<span class="tiny level-easy">✓ Aprendido</span>':'<span class="tiny">En progreso</span>'}</div><label class="studyHint" for="journal-${x.id}">Mi comentario personal</label><textarea id="journal-${x.id}" class="journalNote" data-note="${x.id}" maxlength="3000" placeholder="Añade tu conclusión o preguntas">${escapeHTML(e.note||'')}</textarea><button class="back" data-action="goto-entry" data-id="${x.id}">Ver ficha y cambiar valoración →</button></article>`}).join('')}</div>`:'<div class="emptyStudy">Todavía no tienes valoraciones ni apuntes. Abre la Enciclopedia, marca un concepto como aprendido o escribe una nota; aparecerá aquí.</div>'}${futureJournal()}<div class="sectionTitle"><h2>Qué he aprendido jugando</h2><p>${study.insights.length} registros</p></div>${study.insights.length?`<div class="insightList">${study.insights.slice(0,100).map(i=>`<article class="insight"><strong>${escapeHTML(i.title)}</strong><p>${escapeHTML(i.why)}</p><small>${escapeHTML(i.missionName)} · ${escapeHTML(i.action)} · ${dateES(i.seenAt)}</small></article>`).join('')}</div>`:'<div class="emptyStudy">Cuando resuelvas una crisis durante una misión, su explicación se guardará aquí automáticamente.</div>'}`}
function exportStudy(){const backup={app:'STACKSHIFT',version:2,exportedAt:new Date().toISOString(),study,gameProgress:progress};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='stackshift-mi-cuaderno.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Copia descargada')}
function importStudy(file){if(!file||file.size>2000000){toast('El archivo es demasiado grande');return;}const fr=new FileReader();fr.onload=()=>{try{const data=JSON.parse(fr.result);if(data.app!=='STACKSHIFT'||!data.study||typeof data.study!=='object')throw Error('bad backup');const entries={};const allowed=new Set(ALL_CONCEPTS.map(x=>x.id));for(const [id,v] of Object.entries(data.study.entries||{})){if(!allowed.has(id)||!v||typeof v!=='object')continue;entries[id]={rating:clamp(Number(v.rating)||0,0,5),note:String(v.note||'').slice(0,3000),learned:!!v.learned,updatedAt:typeof v.updatedAt==='string'?v.updatedAt:new Date().toISOString()}}study.entries={...study.entries,...entries};if(Array.isArray(data.study.insights)){const valid=data.study.insights.filter(x=>x&&typeof x==='object'&&typeof x.why==='string').slice(0,150).map(x=>({id:String(x.id||''),mission:String(x.mission||''),missionName:String(x.missionName||'').slice(0,150),base:String(x.base||''),pattern:String(x.pattern||''),title:String(x.title||'').slice(0,200),why:String(x.why||'').slice(0,2000),action:String(x.action||'').slice(0,100),seenAt:String(x.seenAt||'')}));const dedupe=new Map([...study.insights,...valid].map(x=>[x.mission+'|'+x.base+'|'+x.pattern+'|'+x.title+'|'+x.action,x]));study.insights=[...dedupe.values()].slice(0,150)}if(data.study.roadmap&&typeof data.study.roadmap==='object'){const areaIds=new Set(FUTURE_AREAS.map(a=>a.id));for(const [id,v] of Object.entries(data.study.roadmap)){if(!areaIds.has(id)||!v||typeof v!=='object')continue;study.roadmap[id]={interested:!!v.interested,note:String(v.note||'').slice(0,2000),updatedAt:typeof v.updatedAt==='string'?v.updatedAt:new Date().toISOString()}}}persistStudy();if(data.gameProgress&&typeof data.gameProgress==='object'&&data.gameProgress.best){progress.best={...progress.best,...data.gameProgress.best};save(SAVE_KEY,progress)}go('journal');toast('Cuaderno restaurado')}catch(e){toast('JSON no válido para STACK//SHIFT')}};fr.readAsText(file)}
function help(){return `<div class="codexHero"><p class="eyebrow">GUÍA RÁPIDA</p><h1>Arquitecturas, no cuestionarios</h1><p>Prueba diseños, acepta decisiones incómodas y descubre qué ocurre con tus usuarios.</p></div><div class="helpBlock"><h2>Cómo jugar en 30 segundos</h2><ol><li>Elige un contrato: desde una pizzería pequeña hasta una fábrica de IA.</li><li>Selecciona una <strong>base</strong> (cómo despliegas) y una <strong>táctica</strong> (cómo organizas o comunicas).</li><li>Resuelve cuatro crisis escogiendo una respuesta cada vez. Verás el impacto estimado antes de pulsar.</li><li>Termina con integridad por encima de la meta del contrato, presupuesto no negativo y deuda por debajo del límite para superar la misión.</li></ol><div class="example"><strong>⚙️ Los cuatro conceptos del juego</strong><p><strong>Integridad:</strong> disponibilidad y estabilidad combinadas. Cada contrato tiene una meta mínima; si llega a cero, pierdes.</p><p><strong>Créditos:</strong> dinero para las acciones y operación por ronda. Un saldo inferior a −25 termina la partida.</p><p><strong>Deuda técnica:</strong> atajos y complejidad acumulada. Cuanta más, más daño recibirás después y más difícil será cumplir el contrato.</p><p><strong>Reputación:</strong> satisfacción y confianza. Afecta a la puntuación.</p></div><h2>Regla fundamental</h2><p>Un monolito puede ser excelente para un proyecto pequeño. Los microservicios pueden ser ideales para sistemas grandes, pero añaden redes, despliegues, coordinación y costes. Serverless escala por demanda, aunque no todos los trabajos encajan. No se trata de elegir siempre lo más moderno.</p><p><strong>¿Y las arquitecturas combinadas?</strong> Sí: cliente-servidor, hexagonal, capas, eventos, CQRS o Clean Architecture no son necesariamente rivales de monolitos o microservicios. En el juego limitamos a una táctica por contrato para enseñar claramente sus efectos. En un proyecto real se pueden mezclar varios patrones.</p><p>Es un simulador educativo con números inventados, <strong>no una predicción de rendimiento o de coste real</strong>. Funciona sin conexión tras abrir el archivo, no necesita registro y guarda tus récords, valoraciones, comentarios y aprendizajes en este navegador. Puedes exportar e importar el cuaderno como JSON; no hay sincronización automática entre dispositivos.</p></div>`}
function render(){if(!app)return;let page=screen==='home'?home():screen==='config'?config():screen==='play'?play():screen==='resolve'?resolve():screen==='finish'?finish():screen==='codex'?codex():screen==='journal'?journal():screen==='roadmap'?roadmap():help();app.innerHTML=header()+`<main id="main">${page}</main><footer class="footer"><strong>STACK//SHIFT</strong> · Aprende las reglas. Rompe el sistema. Entiende el porqué. · v1.3</footer>`}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let ac=el.dataset.action,id=el.dataset.id;switch(ac){case'tab':go(el.dataset.target);break;case'mission':missionId=id;go('config');sfx('good');break;case'pick':if(el.dataset.kind==='base')baseId=id;else patternId=id;render();sfx('good');break;case'start':start();break;case'choose':choose(id);break;case'next':next();break;case'exit':go('home');break;case'resume':if(game)go(game.phase==='resolve'?'resolve':'play');break;case'retry':missionId=game.mission;baseId=game.base;patternId=game.pattern;start();break;case'rebuild':missionId=game.mission;baseId=game.base;patternId=game.pattern;go('config');break;case'sound':sound=!sound;render();if(sound)sfx('good');else toast('Sonido desactivado');break;
case'rate':{let v=Number(el.dataset.value),e={...studyEntry(id)};e.rating=e.rating===v?0:v;e.updatedAt=new Date().toISOString();study.entries[id]=e;persistStudy();render();break;}
case'learn':{let e={...studyEntry(id)};e.learned=!e.learned;e.updatedAt=new Date().toISOString();study.entries[id]=e;persistStudy();render();toast(e.learned?'Marcado como aprendido':'Marcado para repasar');break;}
case'goto-entry':go('codex');document.getElementById('concept-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});break;
case'roadmap-interest':{if(!FUTURE_AREAS.some(a=>a.id===id))break;const r={...roadmapEntry(id)};r.interested=!r.interested;r.updatedAt=new Date().toISOString();study.roadmap[id]=r;persistStudy();const y=window.scrollY;render();window.scrollTo(0,y);toast(r.interested?'Añadida a tus prioridades':'Quitada de tus prioridades');break;}
case'roadmap-filter':roadmapFilter=id;render();break;
case'roadmap-focus':roadmapFilter='all';go('roadmap');document.getElementById('area-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});break;
case'export-study':exportStudy();break;
case'import-study':document.getElementById('studyImport')?.click();break;}});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-roadmap-note]')){const id=el.dataset.roadmapNote;if(!FUTURE_AREAS.some(a=>a.id===id))return;const r={...roadmapEntry(id)};r.note=el.value.slice(0,2000);r.updatedAt=new Date().toISOString();study.roadmap[id]=r;persistStudy();}else if(el.matches('[data-note]')){const id=el.dataset.note;if(!ALL_CONCEPTS.some(x=>x.id===id))return;const entry={...studyEntry(id)};entry.note=el.value.slice(0,3000);entry.updatedAt=new Date().toISOString();study.entries[id]=entry;persistStudy();}else if(el.id==='codexSearch'){const q=el.value.toLocaleLowerCase('es').trim();let visible=0;document.querySelectorAll('[data-concept-card]').forEach(card=>{const ok=!q||card.dataset.search.includes(q);card.classList.toggle('hiddenSearch',!ok);if(ok)visible++});document.querySelectorAll('[data-concept-group]').forEach(g=>g.classList.toggle('hiddenSearch',!g.querySelector('[data-concept-card]:not(.hiddenSearch)')));const count=document.getElementById('searchCount');if(count)count.textContent=visible+' resultados';}});
document.addEventListener('change',e=>{if(e.target.id==='studyImport'){importStudy(e.target.files?.[0]);e.target.value='';}});
const saved=read(GAME_KEY,null);if(saved&&MISSIONS.some(m=>m.id===saved.mission)&&BASES.some(b=>b.id===saved.base)&&PATTERNS.some(p=>p.id===saved.pattern)&&['play','resolve'].includes(saved.phase)&&Number.isInteger(saved.wave)&&saved.wave>=0&&saved.wave<4){game=saved;missionId=game.mission;baseId=game.base;patternId=game.pattern;toast('Tu partida sigue guardada. Pulsa «Continuar».')}render();
})();
</script>
